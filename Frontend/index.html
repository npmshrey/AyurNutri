<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AyurNutri — Ayurvedic diet planning for practitioners</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F5A3A" />
    <meta
      name="description"
      content="AyurNutri helps Ayurvedic dietitians assess dosha, build diet plans from a food library that carries both nutrient and Ayurvedic data, and follow patients day by day."
    />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Apply the saved theme before first paint so dark-mode users
      // don't see a flash of the light theme on every page load.
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
